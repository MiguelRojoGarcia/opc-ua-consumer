[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:opc-ua-consumer]
command=/usr/local/bin/opc-ua-consumer run
user=consumer
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=15
; Los logs del proceso van a la salida del contenedor (docker logs)
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
