services:
  kepserver:
    build: ./kepserver-sim
    container_name: kepserver-sim
    ports:
      - "49320:49320"
    volumes:
      # Edita los tags sin reconstruir la imagen (requiere `make restart`)
      - ./kepserver-sim/config:/config:ro
    environment:
      UPDATE_INTERVAL_MS: "1000"
      LOG_LEVEL: INFO
    restart: unless-stopped

  # Kafka de un solo nodo en modo KRaft (sin ZooKeeper).
  # - Desde otros contenedores: kafka:9092
  # - Desde el host (go run, tests de integración): localhost:9094
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # Crea el tópico de medidas una vez Kafka está listo. Varias particiones para
  # que distintos centros se repartan; cada centro (key) va siempre a la misma.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092",
                 "--create", "--if-not-exists", "--topic", "measurements", "--partitions", "3", "--replication-factor", "1"]
    restart: "no"

  # Interfaz web para ver tópicos, particiones, mensajes y consumer groups:
  # http://localhost:8085
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    restart: unless-stopped

  consumer:
    build: .
    container_name: opc-ua-consumer
    volumes:
      # Edita los tags sin reconstruir la imagen (requiere `make consumer-restart`)
      - ./config:/etc/opc-ua-consumer:ro
    depends_on:
      kepserver:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      CENTER_ID: center-01
      OPCUA_ENDPOINT: opc.tcp://kepserver:49320
      OPCUA_SAMPLING_INTERVAL: 500ms
      OPCUA_PUBLISHING_INTERVAL: 1s
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: measurements
      LOG_LEVEL: info
      LOG_FORMAT: text
    restart: unless-stopped
